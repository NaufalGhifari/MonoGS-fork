name: MonoGS
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip=23.3.1
  # Modernized CUDA stack for DGX compatibility
  - pytorch=2.1.0
  - torchvision=0.16.0
  - torchaudio=2.1.0
  - pytorch-cuda=11.8
  - cuda-toolkit=11.8
  - cuda-nvcc=11.8
  # Build tools and DGX fixes
  - ninja
  - libxcrypt
  - binutils_linux-64=2.40   # FIXES .relr.dyn error
  - gxx_linux-64=11.4        # STABLE COMPILER
  - gcc_linux-64=11.4
  - cuda-cccl=11.8           # PROVIDES thrust/cub headers
  # Original dependencies
  - plyfile=0.8.1
  - tqdm
  - pip:
      - numpy<2
      - opencv-python==4.8.1.78
      - munch
      - trimesh
      - evo==1.11.0
      - open3d==0.17.0
      - torchmetrics
      - imgviz
      - PyOpenGL
      - glfw
      - PyGLM
      - wandb
      - lpips
      - rich
      - ruff