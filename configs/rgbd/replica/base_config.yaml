Results:
  save_results: True
  save_dir: "results"
  save_trj: True
  save_trj_kf_intv: 20
  use_gui: False
  eval_rendering: False
  use_wandb: False

Dataset:
  sensor_type: 'depth'
  pcd_downsample: 128          # Changed (64 -> 128): Reduces initial point cloud density
  pcd_downsample_init: 64      # Changed (32 -> 64): Fewer initial points = fewer Gaussiansadaptive_pointsize: True
  adaptive_pointsize: True
  point_size: 0.05
  type: 'replica'
  Calibration:
    fx: 600.0
    fy: 600.0
    cx: 599.5
    cy: 339.5
    k1: 0.0
    k2: 0.0
    p1: 0.0
    p2: 0.0
    k3: 0.0
    width: 1200
    height: 680
    depth_scale: 6553.5
    distorted: False


Training:
  init_itr_num: 600            # Changed (1050 -> 600): Shorter init, less over-densification at start
  init_gaussian_update: 100
  init_gaussian_reset: 400     # Changed (500 -> 400)
  init_gaussian_th: 0.005
  init_gaussian_extent: 30
  tracking_itr_num: 60         # Changed (100 -> 60): Speeds up tracking, reduces active graph size
  mapping_itr_num: 100         # Changed (150 -> 100): Fewer mapping iterations saves memory per stepgaussian_update_every: 150
  gaussian_update_every: 150
  gaussian_update_offset: 50
  gaussian_th: 0.7
  gaussian_extent: 1.0
  gaussian_reset: 1000         # Changed (2001 -> 1000): Resets/prunes dead transparent Gaussians twice as often
  size_threshold: 20
  kf_interval: 8               # Changed (5 -> 8): Spares out keyframe creation to slow down model growth
  window_size: 5               # CRITICAL (8 -> 5): Reduces the local mapping bundle adjustment window size
  pose_window: 2               # Changed (3 -> 2): Reduces active tracking historyedge_threshold: 4
  edge_threshold: 4
  rgb_boundary_threshold: 0.01

  kf_translation: 0.15         # Changed (0.08 -> 0.15): Generates fewer keyframes based on movement
  kf_min_translation: 0.10     # Changed (0.05 -> 0.10)
  kf_overlap: 0.8              # Changed (0.9 -> 0.8): Less aggressive keyframe overlapping
  prune_mode: 'slam'
  single_thread: True
  spherical_harmonics: False
  lr:
    cam_rot_delta: 0.003
    cam_trans_delta: 0.001


opt_params:
  iterations: 30000
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 30000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.001
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  densification_interval: 150  # Changed (100 -> 150): Densifies less frequently
  opacity_reset_interval: 2000 # Changed (3000 -> 2000): Prunes transparent points sooner
  densify_from_iter: 500
  densify_until_iter: 12000    # Changed (15000 -> 12000): Cuts off growth earlier in the run
  densify_grad_threshold: 0.0004 # Changed (0.0002 -> 0.0004): Strict gradient threshold = fewer new points

model_params:
  sh_degree: 0
  source_path: ""
  model_path: ""
  resolution: -1
  white_background: False
  data_device: "cuda"
  
pipeline_params:
  convert_SHs_python: False
  compute_cov3D_python: False

shape:
  force_isotropic: False